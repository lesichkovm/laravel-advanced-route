name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [7.4, 8.0, 8.1, 8.2, 8.3, 8.4, 8.5]
        laravel: [9.*, 10.*, 11.*, 12.*, 13.*]
        exclude:
          - php: 7.4
            laravel: 10.*
          - php: 7.4
            laravel: 11.*
          - php: 7.4
            laravel: 12.*
          - php: 7.4
            laravel: 13.*
          - php: 8.0
            laravel: 10.*
          - php: 8.0
            laravel: 11.*
          - php: 8.0
            laravel: 12.*
          - php: 8.0
            laravel: 13.*
          - php: 8.1
            laravel: 9.*
          - php: 8.1
            laravel: 13.*
          - php: 8.2
            laravel: 9.*
          - php: 8.3
            laravel: 9.*
          - php: 8.4
            laravel: 9.*
          - php: 8.4
            laravel: 10.*
          - php: 8.5
            laravel: 9.*
          - php: 8.5
            laravel: 10.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update
          composer update --prefer-dist --no-interaction --no-audit

      - name: Run tests
        run: composer test
