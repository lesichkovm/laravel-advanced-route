name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            laravel: '8.*'
            testbench: '^6.0'
          - php: '8.0'
            laravel: '9.*'
            testbench: '^7.0'
          - php: '8.1'
            laravel: '10.*'
            testbench: '^8.0'
          - php: '8.2'
            laravel: '10.*'
            testbench: '^8.0'
          - php: '8.2'
            laravel: '11.*'
            testbench: '^9.0'
          - php: '8.2'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '10.*'
            testbench: '^8.0'
          - php: '8.3'
            laravel: '11.*'
            testbench: '^9.0'
          - php: '8.3'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '13.*'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '11.*'
            testbench: '^9.0'
          - php: '8.4'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'
          - php: '8.5'
            laravel: '11.*'
            testbench: '^9.0'
          - php: '8.5'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.5'
            laravel: '13.*'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update --prefer-dist --no-interaction --no-audit

      - name: Run tests
        run: composer test
